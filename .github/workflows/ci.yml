name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall backend frontend
      - name: Import FastAPI app
        run: python -c "from backend.main import app; assert app.title == 'The Brief Intelligence API'"
